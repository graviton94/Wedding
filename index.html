<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Great+Vibes&family=Noto+Serif+KR:wght@200;300;400;500&display=swap" rel="stylesheet" />

  <!-- Cache Control -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- 기본 메타 태그 -->
  <title>최준영 ❤️ 민수영 결혼합니다</title>
  <meta name="description" content="2026년 9월 20일 더 화이트베일. 저희의 시작을 축복해 주세요." />

  <!-- Open Graph 메타 태그 (링크 공유 시 썸네일) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://graviton94.github.io/Wedding/" />
  <meta property="og:title" content="최준영 ❤️ 민수영 결혼합니다" />
  <meta property="og:description" content="2026년 9월 20일 오후 12:30, 더 화이트베일" />
  <meta property="og:image" content="https://graviton94.github.io/Wedding/images/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card 메타 태그 -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="최준영 ❤️ 민수영 결혼합니다" />
  <meta name="twitter:description" content="2026년 9월 20일 오후 12:30, 더 화이트베일" />
  <meta name="twitter:image" content="https://graviton94.github.io/Wedding/images/og.jpg" />
</head>

<body>
  <script>
    // 페인트 전에 테마 설정(깜빡임 방지): 저장된 선택이 있으면 그걸, 없으면 다크 기본
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
