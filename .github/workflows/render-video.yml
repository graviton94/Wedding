name: Render Wedding Video

# 로컬에 Node가 없어도 MP4를 뽑을 수 있게 하는 수동 실행 워크플로.
# Actions 탭 → Render Wedding Video → Run workflow → 끝나면 Artifacts에서 mp4 다운로드.
#
# 주의: video.project.json 과 .lrc 자막 파일이 저장소에 커밋되어 있어야 합니다.

on:
  workflow_dispatch:
    inputs:
      project:
        description: '프로젝트 JSON 경로'
        required: false
        default: 'video.project.json'
      duration:
        description: '길이(초) — 비우면 음원 전체'
        required: false
        default: ''
      width:
        description: '가로 해상도 — 비우면 프로젝트 설정값'
        required: false
        default: ''
      preview:
        description: '저화질 빠른 렌더 (640x360)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    # 5분 넘는 영상은 인코딩에 시간이 걸리므로 넉넉히
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache render fonts
        id: font-cache
        uses: actions/cache@v4
        with:
          path: assets/fonts
          key: video-fonts-v1

      - name: Fetch fonts
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: npm run video:fonts

      - name: Render
        run: |
          ARGS="--project ${{ inputs.project }}"
          [ -n "${{ inputs.duration }}" ] && ARGS="$ARGS --duration ${{ inputs.duration }}"
          [ -n "${{ inputs.width }}" ]    && ARGS="$ARGS --width ${{ inputs.width }}"
          [ "${{ inputs.preview }}" = "true" ] && ARGS="$ARGS --preview"
          echo "render args: $ARGS"
          node tools/video/render.mjs $ARGS

      - name: Render contact sheet
        run: node tools/video/render.mjs --project ${{ inputs.project }} --contact-sheet

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: wedding-video
          path: |
            out/*.mp4
            out/*.png
          retention-days: 14
          if-no-files-found: error
